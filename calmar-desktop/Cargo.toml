[package]
name = "calmar-desktop"
description = "Desktop application for Calmar - Markdown note vault with Git-backed history"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
calmar.workspace = true
iced = { version = "0.14.0", features = ["markdown", "advanced"] }
iced_fonts = { version = "0.3", features = ["lucide"] }
rfd = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.3"

[dev-dependencies]
tempfile = "3.27"
